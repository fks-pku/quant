research:
  auto_run: false
  interval_days: 7
  sources:
    - ssrn
    - bigquant
    - jointquant
    - quantocracy
    - hudson_thames
    - portfolio_optimizer
    - alpha_architect
    - quantpedia
  max_results_per_source: 10
  backtest_sharpe_threshold: 0.5
  auto_backtest: true
  default_backtest_start: "2016-01-01"
  default_backtest_end: "2026-05-31"
  default_initial_cash: 10000
  default_symbols:
    - "000300"
    - "000905"
    - "600519"
    - "000001"
    - "510300"
  rigor_config:
    purged_walkforward:
      parallel_workers: 4
      prefetch_data: false
  validation_config:
    pre_full_gate_enabled: true
    fast_gate_min_rank_ic: 0.02
    fast_gate_min_top_bucket_after_cost_sharpe: 0.5
    fast_gate_min_top_bucket_after_cost_annualized_return: 0.05
    fast_gate_max_top_bucket_after_cost_drawdown: 0.50
    fast_gate_fail_on_high_ic_decay: false
    sensitivity_enabled: false
    sensitivity_lookback_grid: [10, 15, 20, 25, 30]
    sensitivity_horizon_grid: [1, 3, 5, 10, 21]
    sensitivity_max_degradation_pct: 30
  production_gate_config:
    min_strict_cagr: 0.05
    max_drawdown_cagr_5_10: 0.15
    max_drawdown_cagr_10_15: 0.25
    max_drawdown_cagr_15_20: 0.30
    max_drawdown_cagr_20_plus: 0.50
    min_total_trades: 50
    max_adv_participation: 0.05
  pit_enabled: false
  pit_universe_snapshot_dir: quant/infrastructure/var/research/universe_snapshots
  scout_config:
    rank_results: true
    min_discovery_score: 5.0
    required_match_terms: [daily_ohlcv]
    required_any_match_terms: [liquid_equity, factor, momentum, mean_reversion, breakout, regime, rank_ic, cost_aware]
    blocked_risk_flags: [high_frequency_not_daily, intraday_dependency, crypto_capacity_risk, non_equity_market, non_price_signal, alternative_data_required]
    source_quality:
      arxiv: 1.75
      ssrn: 1.65
      nber: 1.55
      blog: 0.95
      ashare_public_forum: 1.20
      bigquant: 1.20
      joinquant: 1.15
      jointquant: 1.15
      quantocracy: 1.15
      hudson_thames: 1.30
      portfolio_optimizer: 1.25
      alpha_architect: 1.35
      quantpedia: 1.40
      ashare_structural: 1.55
    query_plan:
      ssrn:
        - query: "daily trading strategy equity factor"
        - query: "cross sectional momentum anomaly"
        - query: "mean reversion equity strategy"
      bigquant:
        - query: "行业 轮动"
        - query: "Alpha101"
        - query: "景气度 趋势 拥挤度"
      jointquant:
        - query: "小市值"
        - query: "多因子"
      quantocracy:
        - query: "daily factor momentum mean reversion"
        - query: "quant trading strategy transaction costs"
      hudson_thames:
        - query: "daily mean reversion momentum portfolio optimization"
        - query: "backtesting pitfalls daily equity strategy"
      portfolio_optimizer:
        - query: "portfolio optimization daily allocation risk"
        - query: "risk parity momentum allocation"
      alpha_architect:
        - query: "factor investing momentum value quality"
        - query: "daily equity factor strategy"
      quantpedia:
        - query: "daily equity factor momentum seasonality"
        - query: "market timing asset allocation strategy"
  evaluation_config:
    target_market: cn
    default_symbols: ["000300", "000905", "600519", "000001", "510300"]
    source_quality:
      arxiv: 1.75
      ssrn: 1.65
      nber: 1.55
      blog: 0.95
      quantocracy: 1.15
      hudson_thames: 1.30
      portfolio_optimizer: 1.25
      alpha_architect: 1.35
      quantpedia: 1.40

validation:
  sensitivity_enabled: false
  sensitivity_lookback_grid: [10, 15, 20, 25, 30]
  sensitivity_horizon_grid: [1, 3, 5, 10, 21]
  sensitivity_max_degradation_pct: 30

pit:
  enabled: false
  universe_snapshot_dir: quant/infrastructure/var/research/universe_snapshots

llm:
  provider: deepseek  # openai | claude | ollama | minimax | deepseek | glm
  model: deepseek-chat
  # api_key: Set via DEEPSEEK_API_KEY environment variable
  # Or uncomment and set directly (not recommended for security):
  # api_key: "..."
  temperature: 0.3
