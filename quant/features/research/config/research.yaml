research:
  auto_run: false
  interval_days: 7
  sources:
    - arxiv
    - ssrn
    - nber
    - blog
  max_results_per_source: 10
  evaluation_threshold: 6.0
  backtest_sharpe_threshold: 0.5
  auto_backtest: true
  default_backtest_start: "2016-01-01"
  default_backtest_end: "2025-12-31"
  default_symbols:
    - "000300"
    - "000905"
    - "600519"
    - "000001"
    - "510300"
  rigor_config:
    purged_walkforward:
      parallel_workers: 4
      prefetch_data: false
  validation_config:
    sensitivity_enabled: false
    sensitivity_lookback_grid: [10, 15, 20, 25, 30]
    sensitivity_horizon_grid: [1, 3, 5, 10, 21]
    sensitivity_max_degradation_pct: 30
  production_gate_config:
    min_rank_ic: 0.02
    min_rank_ic_ir: 0.30
    min_rank_ic_tstat: 2.0
    min_hit_rate: 0.55
    min_strict_sharpe: 0.80
    min_strict_cagr: 0.05
    max_strict_drawdown: 0.25
    min_calmar: 0.70
    min_profit_factor: 1.20
    min_total_trades: 50
    min_aggregate_oos_sharpe: 0.80
    min_worst_oos_sharpe: 0.30
    min_profitable_splits_pct: 0.55
    min_deflated_sharpe_ratio: 0.95
    max_adv_participation: 0.05
    preferred_mean_correlation: 0.30
    max_mean_correlation: 0.50
  pit_enabled: false
  pit_universe_snapshot_dir: quant/infrastructure/var/research/universe_snapshots
  scout_config:
    rank_results: true
    min_discovery_score: 5.0
    required_match_terms: [daily_ohlcv]
    required_any_match_terms: [liquid_equity, factor, momentum, mean_reversion, breakout, regime, rank_ic, cost_aware]
    blocked_risk_flags: [high_frequency_not_daily, intraday_dependency, crypto_capacity_risk, non_equity_market, non_price_signal, alternative_data_required]
    source_quality:
      arxiv: 1.75
      ssrn: 1.65
      nber: 1.55
      blog: 0.95
    query_plan:
      arxiv:
        - query: "trading strategy"
          category: "q-fin.TR"
        - query: "cross sectional equity factor"
          category: "q-fin.PM"
        - query: "daily return anomaly equity"
          category: "q-fin.PM"
        - query: "mean reversion equity"
          category: "q-fin.TR"
        - query: "momentum stock returns transaction costs"
          category: "q-fin.PM"
      ssrn:
        - query: "daily trading strategy equity factor"
        - query: "cross sectional momentum anomaly"
        - query: "mean reversion equity strategy"
      nber:
        - query: "asset pricing anomaly"
        - query: "factor momentum equity"
      blog:
        - query: "daily momentum factor"
        - query: "mean reversion trading"
  evaluation_config:
    min_admission_score: 6.0
    target_market: cn
    default_symbols: ["000300", "000905", "600519", "000001", "510300"]
    source_quality:
      arxiv: 1.75
      ssrn: 1.65
      nber: 1.55
      blog: 0.95

evaluation:
  min_admission_score: 6.0

validation:
  sensitivity_enabled: false
  sensitivity_lookback_grid: [10, 15, 20, 25, 30]
  sensitivity_horizon_grid: [1, 3, 5, 10, 21]
  sensitivity_max_degradation_pct: 30

pit:
  enabled: false
  universe_snapshot_dir: quant/infrastructure/var/research/universe_snapshots

llm:
  provider: deepseek  # openai | claude | ollama | minimax | deepseek | glm
  model: deepseek-chat
  # api_key: Set via DEEPSEEK_API_KEY environment variable
  # Or uncomment and set directly (not recommended for security):
  # api_key: "..."
  temperature: 0.3
